<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- 完全ローカルセキュリティ要件: 外部通信・外部スクリプト・フォーム送信を物理的に完全遮断 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none';">
  <title>JOPT 2025 GTO Trainer - No Limit Hold'em</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Layer 1: Header (7dvh) -->
    <header id="header-bar">
      <div class="header-left">
        <h1 class="app-title">NLH GTO <span class="badge-sub">JOPT FT Ed.</span></h1>
        <span id="hand-counter" class="info-pill">Hand #1</span>
      </div>
      <div class="header-controls">
        <label class="ctrl-label" for="select-opponents">卓人数:</label>
        <select id="select-opponents" class="ctrl-select" aria-label="対戦人数選択">
          <option value="1">2-Max (HU)</option>
          <option value="5">6-Max</option>
          <option value="6" >7-Max</option>
          <option value="8" selected>9-Max (FT)</option>
        </select>
        <button id="btn-topup" class="hdr-btn" title="スタックを100BBにリセット">100BB補充</button>
        <button id="btn-stats" class="hdr-btn accent">スタッツ</button>
        <button id="btn-history" class="hdr-btn">履歴(100)</button>
      </div>
    </header>

    <!-- Layer 2: Main Poker Table Area (71dvh) -->
    <main id="table-container">
      <div id="poker-table">
        <div class="table-felt-inner">
          <!-- テーブル中央情報: ポット・ストリート・ボードカード -->
          <div id="table-center">
            <div id="pot-display-area">
              <div id="main-pot-text" class="pot-pill">POT: 0.0 BB</div>
              <div id="side-pots-text" class="side-pot-pill"></div>
            </div>
            <div id="board-cards" class="board-container"></div>
            <div id="street-indicator" class="street-label">WAITING</div>
          </div>
        </div>
        <!-- プレイヤー座席ポッド動的マウント領域 -->
        <div id="seats-layer"></div>
      </div>

      <!-- ハンド結果＆戦略公開オーバーレイ -->
      <div id="result-overlay" class="overlay-panel hidden">
        <div class="result-header">
          <span id="result-title" class="result-winner-text">Result</span>
          <span id="result-ev-badge" class="result-ev-text"></span>
        </div>
        <div id="result-cpu-reveal" class="reveal-list"></div>
        <div class="result-Footer">
          <button id="btn-next-hand" class="primary-next-btn">次のハンドへ (Space / Enter)</button>
        </div>
      </div>
    </main>

    <!-- Layer 3: Action & Bet Sizing Control Panel (22dvh) -->
    <footer id="control-panel">
      <!-- 上段: 固定倍率ボタン (2x, 2.5x, 3x, 4x) ＆ 自由調整スライダー -->
      <div id="sizing-row" class="sizing-bar">
        <div class="mult-buttons">
          <button type="button" class="mult-btn" data-mult="2">2x</button>
          <button type="button" class="mult-btn" data-mult="2.5">2.5x</button>
          <button type="button" class="mult-btn" data-mult="3">3x</button>
          <button type="button" class="mult-btn" data-mult="4">4x</button>
          <button type="button" class="mult-btn" data-pot="0.5">50%</button>
          <button type="button" class="mult-btn" data-pot="1">Pot</button>
          <button type="button" class="mult-btn" data-allin="true">MAX</button>
        </div>
        <div class="slider-wrapper">
          <input type="range" id="bet-slider" min="200" max="10000" step="10" value="200" aria-label="ベットサイズ調整スライダー">
          <div class="slider-readout">
            <span id="slider-val-label">2.0 BB</span>
          </div>
        </div>
      </div>

      <!-- 下段: メインアクションボタン + Hero現在役リアルタイムモニター -->
      <div id="action-row" class="action-bar">
        <div id="hero-live-status" class="hero-status-box">
          <div class="status-label">現在の役 / 状態</div>
          <div id="hero-hand-strength" class="status-value">待機中...</div>
        </div>
        <div class="action-buttons-group">
          <button type="button" id="btn-fold" class="act-btn btn-fold" disabled>FOLD</button>
          <button type="button" id="btn-check-call" class="act-btn btn-call" disabled>CHECK</button>
          <button type="button" id="btn-bet-raise" class="act-btn btn-raise" disabled>RAISE 2.0 BB</button>
        </div>
      </div>
    </footer>

    <!-- Modal 1: スタッツ分析モーダル (Ten-Four準拠: 直近100 / 1,000 / 10,000 / Total) -->
    <div id="modal-stats" class="modal-backdrop hidden">
      <div class="modal-window">
        <div class="modal-header">
          <h2>プレイヤースタッツ分析 (Ten-Four 準拠)</h2>
          <button type="button" class="modal-close" data-close="modal-stats">&times;</button>
        </div>
        <div class="modal-body">
          <div class="stats-tabs">
            <button type="button" class="tab-btn active" data-span="100">直近 100</button>
            <button type="button" class="tab-btn" data-span="1000">直近 1,000</button>
            <button type="button" class="tab-btn" data-span="10000">直近 10,000</button>
            <button type="button" class="tab-btn" data-span="ALL">トータル</button>
          </div>
          <div id="stats-grid-container" class="stats-grid"></div>
          <div class="stats-note">
            ※VPIP / PFRはWalk（BB不戦勝）を除外して算出。収支(EV)およびWinRate(EV)はリバー前のオールイン発生時にモンテカルロ法(600回試行)で算出した期待値です。
          </div>
          <div class="modal-actions-bottom">
            <button type="button" id="btn-clear-stats" class="danger-btn">統計データを初期化</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal 2: ハンド履歴モーダル (直近100ハンド詳細＆CPU戦略公開) -->
    <div id="modal-history" class="modal-backdrop hidden">
      <div class="modal-window">
        <div class="modal-header">
          <h2>ハンド履歴 (直近 100 ハンド)</h2>
          <button type="button" class="modal-close" data-close="modal-history">&times;</button>
        </div>
        <div class="modal-body">
          <div id="history-list-container" class="history-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
