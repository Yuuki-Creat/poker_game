<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- フルスクリーン化（疑似PWA対応）のためのタグを追加 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Texas Hold'em Poker - AI Strategy Unveil</title>
  <link rel="stylesheet" href="./assets/styles/main.css">
  <link rel="stylesheet" href="./assets/styles/table.css">
  <link rel="stylesheet" href="./assets/styles/components.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー情報 -->
    <header class="game-header">
      <div class="header-title">TEXAS HOLD'EM <span class="badge-sub">100BB Deep / 0.5-1.0BB</span></div>
      <div class="header-phase" id="phase-indicator">LOBBY</div>
      <button id="btn-back-lobby" class="btn btn-sm btn-outline">ロビーへ戻る</button>
    </header>

    <!-- メインテーブルエリア -->
    <main class="table-container">
      <div class="poker-table" id="poker-table">
        <!-- センター情報（ポット＆コミュニティカード） -->
        <div class="table-center">
          <div class="pots-container" id="pots-container">
            <div class="main-pot">Total Pot: <span id="total-pot-amount">0.0 BB</span></div>
            <div class="side-pots" id="side-pots-list"></div>
          </div>
          <div class="community-cards" id="community-cards">
            <!-- JSで5枚のカード枠を生成 -->
          </div>
        </div>

        <!-- NPC座席エリア（JSで動的配置） -->
        <div id="npc-seats-container"></div>

        <!-- 人間プレイヤーエリア（下部中央固定） -->
        <div class="player-seat-wrapper" id="human-seat">
          <div class="dealer-button" id="human-dealer-btn" style="display: none;">D</div>
          <div class="bet-chip-badge" id="human-bet-badge" style="display: none;">0.0 BB</div>
          <div class="action-bubble" id="human-action-bubble" style="display: none;"></div>
          
          <div class="player-panel" id="human-panel">
            <div class="player-cards" id="human-cards">
              <div class="card empty-card"></div>
              <div class="card empty-card"></div>
            </div>
            <div class="player-info">
              <div class="player-name-row">
                <span class="player-name">YOU</span>
                <span class="hand-rank-badge" id="human-hand-rank">待機中</span>
              </div>
              <div class="player-stack" id="human-stack">100.0 BB</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 左下：アクションログ -->
    <aside class="log-panel">
      <div class="log-header">Action Log</div>
      <ul class="log-list" id="action-log-list"></ul>
    </aside>

    <!-- 右下：アクションコントロールパネル -->
    <section class="control-panel" id="control-panel">
      <div class="slider-section" id="raise-controls">
        <div class="shortcut-buttons">
          <button class="btn btn-xs" data-shortcut="min">Min</button>
          <button class="btn btn-xs" data-shortcut="1/3">1/3 Pot</button>
          <button class="btn btn-xs" data-shortcut="1/2">1/2 Pot</button>
          <button class="btn btn-xs" data-shortcut="pot">Pot</button>
          <button class="btn btn-xs" data-shortcut="allin">All-In</button>
        </div>
        <div class="slider-row">
          <input type="range" id="bet-slider" min="2000" max="100000" step="100" value="2000">
          <div class="slider-value-box">
            <span id="slider-amount-display">2.0</span> <small>BB</small>
          </div>
        </div>
      </div>
      <div class="action-buttons">
        <button id="btn-fold" class="btn btn-action btn-fold">FOLD</button>
        <button id="btn-check-call" class="btn btn-action btn-call">CHECK</button>
        <button id="btn-raise" class="btn btn-action btn-raise">RAISE TO 2.0 BB</button>
      </div>
    </section>

    <!-- モーダル1：ロビー画面 -->
    <div class="modal-overlay" id="lobby-modal">
      <div class="modal-box">
        <h2>TEXAS HOLD'EM POKER</h2>
        <p class="modal-desc">NPCのプレイスタイル（GTO / TAG / LAG / Nit / Station）を見破り、チップを奪い取れ。<br>ハンド終了時、各NPCの戦略がアンヴェイル（開示）されます。</p>
        <div class="form-group">
          <label>対戦NPC人数を選択:</label>
          <div class="npc-count-selector" id="npc-count-selector">
            <button class="btn btn-select" data-count="1">1人 (Heads-Up)</button>
            <button class="btn btn-select" data-count="4">4人 (5-Max)</button>
            <button class="btn btn-select active" data-count="6">6人 (7-Max)</button>
            <button class="btn btn-select" data-count="9">9人 (10-Max)</button>
          </div>
        </div>
        <button id="btn-start-game" class="btn btn-primary btn-lg">ゲーム開始 (100 BB)</button>
      </div>
    </div>

    <!-- モーダル2：ハンドリザルト＆戦略開示オーバーレイ -->
    <div class="result-bar" id="result-bar" style="display: none;">
      <div class="result-info">
        <div class="result-title" id="result-title">Winner: YOU (+15.5 BB)</div>
        <div class="result-sub" id="result-sub">全てのNPCの戦略バッジが開示されました</div>
      </div>
      <div class="result-actions">
        <button id="btn-next-hand" class="btn btn-primary">次のハンドへ ▶</button>
        <button id="btn-gameover-lobby" class="btn btn-danger" style="display: none;">破産しました（ロビーへ）</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
